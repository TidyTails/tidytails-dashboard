<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quote Calculator — Tidy Tails STL</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
  :root {
    --bg: #0a0d14; --card: #111420; --border: #1e2540;
    --text: #e2e8f0; --dim: #8b95aa; --green: #22c55e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; padding: 20px 16px 60px; }
  h1 { font-size: 22px; font-weight: 900; color: var(--green); margin-bottom: 6px; }
  .sub { font-size: 13px; color: var(--dim); margin-bottom: 24px; }
  label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 6px; margin-top: 16px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
  select, input[type=number] {
    width: 100%; padding: 12px; background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 14px; font-family: inherit;
  }
  .result {
    background: var(--card); border: 1px solid var(--green); border-radius: 12px;
    padding: 20px; margin-top: 24px; text-align: center;
  }
  .result-label { font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
  .result-price { font-size: 42px; font-weight: 900; color: var(--green); }
  .result-sub { font-size: 13px; color: var(--dim); margin-top: 6px; }
  .breakdown { margin-top: 20px; font-size: 13px; color: var(--dim); text-align: left; }
  .breakdown li { padding: 4px 0; }
  .btn { display: block; width: 100%; padding: 14px; background: var(--green); color: #000; font-size: 15px; font-weight: 800; border: none; border-radius: 10px; margin-top: 20px; cursor: pointer; font-family: inherit; }
  a.back { display: block; text-align: center; padding: 14px; color: var(--dim); font-size: 13px; margin-top: 16px; }
</style>
</head>
<body>
<h1>💰 Quote Calculator</h1>
<p class="sub">Instantly calculate the right price for any customer.</p>

<label>Frequency</label>
<select id="freq" onchange="calc()">
  <option value="weekly">Weekly</option>
  <option value="biweekly">Every 2 Weeks</option>
  <option value="monthly">Monthly (Deep Clean)</option>
  <option value="onetime">One-Time Cleanup</option>
</select>

<label>Number of Dogs</label>
<input type="number" id="dogs" value="1" min="1" max="10" onchange="calc()">

<label>Yard Size</label>
<select id="yard" onchange="calc()">
  <option value="small">Small (under 1/4 acre)</option>
  <option value="medium">Medium (1/4 – 1/2 acre)</option>
  <option value="large">Large (1/2+ acre)</option>
</select>

<div class="result">
  <div class="result-label">Recommended Price</div>
  <div class="result-price" id="price">$25</div>
  <div class="result-sub" id="price-sub">Per visit · Weekly service</div>
  <ul class="breakdown" id="breakdown"></ul>
</div>

<button class="btn" onclick="window.location.href='tel:3148507140'">📞 Call Jamie: (314) 850-7140</button>
<a href="tidytails-dashboard/index.html" class="back">← Back to Command Center</a>

<script>
function calc() {
  const freq = document.getElementById('freq').value;
  const dogs = parseInt(document.getElementById('dogs').value) || 1;
  const yard = document.getElementById('yard').value;

  let base = 0;
  let perVisitLabel = '';
  let monthly = 0;

  // Base pricing
  if (freq === 'weekly') { base = 25; perVisitLabel = 'Per visit · Weekly'; }
  else if (freq === 'biweekly') { base = 40; perVisitLabel = 'Per visit · Biweekly'; }
  else if (freq === 'monthly') { base = 70; perVisitLabel = 'Per month · Monthly flat rate'; }
  else { base = 100; perVisitLabel = 'One-time deep clean'; }

  // Dog multiplier (each extra dog +$5)
  let dogAdd = (dogs - 1) * 5;

  // Yard size
  let yardAdd = 0;
  if (yard === 'medium') yardAdd = 5;
  if (yard === 'large') yardAdd = 15;

  let total = base + dogAdd + yardAdd;

  // Monthly estimate
  if (freq === 'weekly') monthly = total * 4;
  else if (freq === 'biweekly') monthly = total * 2;
  else monthly = total;

  document.getElementById('price').textContent = '$' + total;
  document.getElementById('price-sub').textContent = perVisitLabel + (freq !== 'monthly' && freq !== 'onetime' ? ' · ~$' + monthly + '/mo' : '');

  let breakdown = '<li>Base rate: $' + base + '</li>';
  if (dogAdd > 0) breakdown += '<li>Extra dogs (' + (dogs-1) + 'x $5): +$' + dogAdd + '</li>';
  if (yardAdd > 0) breakdown += '<li>Yard size (' + yard + '): +$' + yardAdd + '</li>';
  document.getElementById('breakdown').innerHTML = breakdown;
}
calc();
</script>
</body>
</html>
