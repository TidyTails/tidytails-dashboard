<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📧 Commercial Email Templates — Tidy Tails</title>
<style>
  :root{--bg:#0a0a0a;--bg2:#141414;--bg3:#1e1e1e;--text:#f5f5f5;--text2:#aaa;--text3:#555;--border:#252525;--green:#10b981;--orange:#ff6b35;--yellow:#fbbf24;--red:#ef4444;--blue:#3b82f6;--purple:#8b5cf6;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);line-height:1.5;}
  .header{background:linear-gradient(135deg,#1e1b4b,#0f172a);padding:24px 20px;text-align:center;border-bottom:2px solid var(--purple);}
  .header h1{font-size:1.5em;font-weight:900;}
  .header .sub{color:var(--purple);font-size:0.85em;font-weight:700;margin-top:4px;}
  .header .meta{color:var(--text3);font-size:0.75em;margin-top:8px;}
  .back{display:inline-block;margin:14px 16px 0;padding:6px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;font-size:0.8em;color:var(--text2);text-decoration:none;}

  .filter-bar{display:flex;gap:8px;padding:14px 16px;overflow-x:auto;background:var(--bg2);border-bottom:1px solid var(--border);}
  .filter-btn{padding:5px 14px;border-radius:99px;font-size:0.75em;font-weight:700;border:1px solid var(--border);background:var(--bg3);color:var(--text2);cursor:pointer;white-space:nowrap;transition:all 0.15s;}
  .filter-btn.active{background:var(--purple);border-color:var(--purple);color:#fff;}

  .template-card{margin:16px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
  .template-head{padding:14px 16px;cursor:pointer;display:flex;align-items:flex-start;gap:10px;}
  .template-head .icon{font-size:1.4em;flex-shrink:0;}
  .template-head .info{flex:1;}
  .template-head h3{font-size:0.9em;font-weight:800;}
  .template-head .desc{font-size:0.75em;color:var(--text3);margin-top:3px;}
  .tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:0.65em;font-weight:700;margin-right:4px;margin-top:4px;}
  .tag-apts{background:rgba(59,130,246,0.15);color:var(--blue);}
  .tag-hoa{background:rgba(139,92,246,0.15);color:var(--purple);}
  .tag-kennels{background:rgba(255,107,53,0.15);color:var(--orange);}
  .tag-vets{background:rgba(16,185,129,0.15);color:var(--green);}
  .tag-parks{background:rgba(251,191,36,0.15);color:var(--yellow);}
  .template-body{display:none;padding:0 16px 16px;border-top:1px solid var(--border);}
  .template-card.open .template-body{display:block;}
  .email-section{margin-top:14px;}
  .email-label{font-size:0.7em;text-transform:uppercase;letter-spacing:0.05em;color:var(--text3);margin-bottom:4px;}
  .email-field{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px 12px;font-size:0.82em;color:var(--text);margin-bottom:10px;word-wrap:break-word;line-height:1.6;white-space:pre-wrap;position:relative;}
  .copy-btn{background:var(--purple);color:#fff;border:none;padding:5px 14px;border-radius:6px;font-size:0.7em;font-weight:700;cursor:pointer;margin-top:6px;display:block;}
  .copy-btn:hover{filter:brightness(1.1);}
  .copy-btn.copied{background:var(--green);color:#000;}
  .notes-box{background:rgba(251,191,36,0.06);border-left:3px solid var(--yellow);padding:10px 12px;border-radius:0 6px 6px 0;font-size:0.78em;color:var(--text2);margin-top:10px;}
  .notes-box strong{color:var(--yellow);}
  .sent-toggle{display:flex;align-items:center;gap:8px;margin-top:12px;cursor:pointer;font-size:0.8em;color:var(--text2);}
  .sent-circle{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .sent-toggle.done .sent-circle{background:var(--green);border-color:var(--green);}
  .sent-toggle.done .sent-circle::after{content:'✓';font-size:0.6em;color:#000;font-weight:900;}
  .sent-toggle.done span{text-decoration:line-through;color:var(--text3);}

  .footer{text-align:center;padding:24px;color:var(--text3);font-size:0.75em;}
</style>
</head>
<body>

<div class="header">
  <h1>📧 Commercial Email Templates</h1>
  <div class="sub">Copy-Paste Outreach for Tier A Leads — 85 Total Targets</div>
  <div class="meta">Edit the [BRACKETS] before sending · Keep it short · Follow up in 5 days</div>
</div>
<a href="index.html" class="back">← Dashboard</a>

<div class="filter-bar">
  <button class="filter-btn active" onclick="filterCards('all', this)">All</button>
  <button class="filter-btn" onclick="filterCards('apts', this)">🏢 Apartments</button>
  <button class="filter-btn" onclick="filterCards('hoa', this)">🏡 HOA/Prop Mgmt</button>
  <button class="filter-btn" onclick="filterCards('kennels', this)">🐕 Dog Businesses</button>
  <button class="filter-btn" onclick="filterCards('vets', this)">🩺 Vet Referrals</button>
  <button class="filter-btn" onclick="filterCards('parks', this)">🌳 Municipal Parks</button>
</div>

<div id="templates-container"></div>

<div class="footer">Built by Franklin 🐕💩 | Tidy Tails STL · Progress saves in your browser</div>

<script>

TJ
Tidy Tails Pet Waste Removal

  },
  {

    icon: '🏡',
    title: 'HOA / Property Management Company',
    desc: 'For: Millsap, Smith Mgmt, Sentry, CPM Gateway, TreeStone, BluSky, Preferred STL',
    tags: ['hoa'],

    body: `Hi [Name],

  {

  {

    subject: 'Professional dog park cleanup service — Tidy Tails STL',
    body: `Hello,

    notes: 'Government emails are formal. Keep it professional. Ask who the RIGHT person is — you might be emailing a general info box. Follow up via phone in 5-7 days.'
  },
  {

    title: 'Multi-Property / Franchise Bundle Pitch',
    desc: 'For: Aventura (MLP LLC), Mission Rock (Emerald Crossing + Steelyard), Gallery STL, No Leash Needed (8 locations)',
    tags: ['apts', 'kennels'],
    subject: 'One vendor for all [X] of your [properties/locations] — Tidy Tails',
    body: `Hi [Contact Name],

I run Tidy Tails — a St. Louis pet waste removal service. I noticed that [Company Name] operates [X] pet-friendly [properties/locations] across the St. Louis area, and I wanted to propose something simple: one vendor, one invoice, for all of them.

Happy to put together a custom quote if you can share how many locations you'd want covered. Would a quick call this week work?

Tidy Tails Pet Waste Removal

🌐 tidytailsstl.com`,
    notes: 'The bundle pitch is the key differentiator here. You\'re not competing for one dog park — you\'re offering one partnership. Emphasize volume discount and simplicity.'
  }
];

const KEY = 'tt-email-templates-v1';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{};}catch{return{};}}
function save(d){localStorage.setItem(KEY,JSON.stringify(d));}

function filterCards(type, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.template-card').forEach(card => {
    if(type === 'all' || card.dataset.tags.includes(type)) {
      card.style.display = '';
    } else {
      card.style.display = 'none';
    }
  });
}

function copyText(id, btn) {
  const el = document.getElementById('body-' + id);
  navigator.clipboard.writeText(el.textContent).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '📋 Copy Email Body'; btn.classList.remove('copied'); }, 2000);
  });
}

function copySubject(id, btn) {
  const el = document.getElementById('subj-' + id);
  navigator.clipboard.writeText(el.textContent).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '📋 Copy Subject'; btn.classList.remove('copied'); }, 2000);
  });
}

function toggleSent(id) {
  const d = load();
  d[id + '_sent'] = !d[id + '_sent'];
  save(d);
  render();
}

function render() {
  const d = load();
  const container = document.getElementById('templates-container');
  container.innerHTML = '';
  TEMPLATES.forEach(t => {
    const sent = d[t.id + '_sent'];
    const card = document.createElement('div');
    card.className = 'template-card';
    card.dataset.tags = t.tags.join(',');
    card.innerHTML = `
      <div class="template-head" onclick="this.closest('.template-card').classList.toggle('open')">
        <div class="icon">${t.icon}</div>
        <div class="info">
          <h3>${t.title}</h3>
          <div class="desc">${t.desc}</div>
          <div>${t.tags.map(tag => `<span class="tag tag-${tag}">${tag}</span>`).join('')}</div>
        </div>
      </div>
      <div class="template-body">
        <div class="email-section">
          <div class="email-label">Subject Line</div>
          <div class="email-field" id="subj-${t.id}">${t.subject}</div>
          <button class="copy-btn" onclick="copySubject('${t.id}', this)">📋 Copy Subject</button>
        </div>
        <div class="email-section">
          <div class="email-label">Email Body (edit [BRACKETS] before sending)</div>
          <div class="email-field" id="body-${t.id}">${t.body}</div>
          <button class="copy-btn" onclick="copyText('${t.id}', this)">📋 Copy Email Body</button>
        </div>
        <div class="notes-box"><strong>💡 Tips:</strong> ${t.notes}</div>
        <div class="sent-toggle ${sent ? 'done' : ''}" onclick="toggleSent('${t.id}')">
          <div class="sent-circle"></div>
          <span>Mark as used / sent to leads</span>
        </div>
      </div>
    `;
    container.appendChild(card);
  });
}

render();
</script>
</body>
</html>
