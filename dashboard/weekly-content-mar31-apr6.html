<style>

  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);line-height:1.5;padding:0;}
  .header{background:linear-gradient(135deg,#065f46,#0f172a);padding:24px 20px;text-align:center;border-bottom:2px solid var(--green);}

  .header h1 span{color:var(--green);}
  .header .sub{color:var(--green);font-size:0.9em;font-weight:600;margin-top:4px;}
  .header .meta{color:var(--text2);font-size:0.8em;margin-top:8px;}
  .back{display:inline-block;margin:16px 20px 0;padding:6px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;font-size:0.8em;color:var(--text2);text-decoration:none;}
  .back:hover{border-color:var(--green);color:var(--green);}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px;padding:16px 20px;background:var(--bg2);border-bottom:1px solid var(--border);}
  .stat{text-align:center;}
  .stat-val{font-size:1.4em;font-weight:800;font-family:'Courier New',monospace;}
  .stat-lbl{font-size:0.6em;text-transform:uppercase;color:var(--text3);letter-spacing:0.05em;}

  .container{max-width:800px;margin:0 auto;padding:20px;}
  .day-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;margin-bottom:16px;overflow:hidden;transition:all 0.2s;}
  .day-card:hover{border-color:var(--green);}
  .day-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;gap:12px;}
  .day-head h3{font-size:0.95em;flex:1;}
  .day-tag{padding:3px 10px;border-radius:99px;font-size:0.65em;font-weight:700;text-transform:uppercase;white-space:nowrap;}
  .tag-fb{background:rgba(59,130,246,0.2);color:var(--blue);}
  .tag-ig{background:rgba(139,92,246,0.2);color:var(--purple);}
  .tag-nd{background:rgba(255,107,53,0.2);color:var(--orange);}
  .tag-gbp{background:rgba(16,185,129,0.2);color:var(--green);}
  .check-icon{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:0.8em;cursor:pointer;flex-shrink:0;transition:all 0.2s;}
  .check-icon.done{background:var(--green);border-color:var(--green);color:#000;}
  .day-body{display:none;padding:0 16px 16px;border-top:1px solid var(--border);}
  .day-card.open .day-body{display:block;}
  .copy-box{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;margin-top:12px;white-space:pre-wrap;word-wrap:break-word;font-size:0.85em;line-height:1.6;color:var(--text2);position:relative;}
  .copy-btn{position:absolute;top:8px;right:8px;background:var(--green);color:#000;border:none;padding:4px 12px;border-radius:6px;font-size:0.7em;cursor:pointer;font-weight:700;}
  .copy-btn:hover{filter:brightness(0.9);}
  .copy-btn.copied{background:var(--text3);color:white;}
  .tip{background:rgba(245,158,11,0.1);border-left:3px solid var(--orange);padding:10px 12px;margin-top:12px;border-radius:0 8px 8px 0;font-size:0.8em;}
  .tip strong{color:var(--orange);}
  .footer{text-align:center;padding:24px;color:var(--text3);font-size:0.75em;}
</style>
</head>

let state=JSON.parse(localStorage.getItem(KEY)||'{}');
function save(){localStorage.setItem(KEY,JSON.stringify(state));updateStats();}
function updateStats(){
  const done=Object.values(state).filter(Boolean).length;
  document.getElementById('st-done').textContent=done;
  document.getElementById('st-pct').textContent=Math.round(done/posts.length*100)+'%';
}

const tagMap={fb:'tag-fb',ig:'tag-ig',nd:'tag-nd',gbp:'tag-gbp'};
const tagLabel={fb:'Facebook',ig:'Instagram',nd:'Nextdoor',gbp:'GBP'};
const container=document.getElementById('cards');

posts.forEach(p=>{
  const card=document.createElement('div');
  card.className='day-card';
  const isDone=state[p.id]||false;
  card.innerHTML=`
    <div class="day-head" onclick="this.parentElement.classList.toggle('open')">
      <div>
        <div style="font-size:0.65em;color:var(--text3);margin-bottom:2px;">${p.day}</div>
        <h3>${p.title}</h3>
      </div>
      ${p.tags.map(t=>`<span class="day-tag ${tagMap[t]}">${tagLabel[t]}</span>`).join('')}
      <div class="check-icon ${isDone?'done':''}" data-id="${p.id}" onclick="event.stopPropagation();toggleDone(this,'${p.id}')">
        ${isDone?'✓':''}
      </div>
    </div>
    <div class="day-body">
      <div class="copy-box"><button class="copy-btn" onclick="copyText(this)">COPY</button>${escHtml(p.copy)}</div>
      ${p.tip?`<div class="tip"><strong>💡 Tip:</strong> ${p.tip}</div>`:''}
    </div>`;
  container.appendChild(card);
});

function toggleDone(el,id){
  state[id]=!state[id];
  el.className='check-icon'+(state[id]?' done':'');
  el.textContent=state[id]?'✓':'';
  save();
}
function copyText(btn){
  const text=btn.parentElement.textContent.replace('COPY','').trim();
  navigator.clipboard.writeText(text).then(()=>{
    btn.textContent='COPIED!';btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='COPY';btn.classList.remove('copied');},2000);
  });
}
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
updateStats();
</script>
