<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>CSI Shot - Tidy Tails Ad</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1080px; overflow: hidden; font-family: 'Arial Black', 'Helvetica Neue', Arial, sans-serif; }
.container { width: 1080px; height: 1080px; background: #0a0a0a; position: relative; display: flex; flex-direction: column; }
.tape-top { background: repeating-linear-gradient(90deg, #ffcc00 0px, #ffcc00 30px, #111 30px, #111 60px); height: 50px; display: flex; align-items: center; justify-content: center; }
.tape-top span { background: #111; color: #ffcc00; padding: 4px 20px; font-size: 24px; font-weight: 900; letter-spacing: 6px; text-transform: uppercase; }
.scene { flex: 1; background: linear-gradient(180deg, #1a2a1a 0%, #0d1a0d 50%, #0a0a0a 100%); position: relative; overflow: hidden; }
.grid-overlay { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, transparent, transparent 99px, rgba(255,204,0,0.05) 100px), repeating-linear-gradient(90deg, transparent, transparent 99px, rgba(255,204,0,0.05) 100px); }
.evidence-marker { position: absolute; width: 60px; height: 80px; background: #ffcc00; color: #111; display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 900; clip-path: polygon(0 0, 100% 0, 100% 70%, 50% 100%, 0 70%); }
.e1 { top: 15%; left: 15%; } .e2 { top: 35%; left: 55%; } .e3 { top: 55%; left: 25%; }
.e4 { top: 25%; left: 75%; } .e5 { top: 65%; left: 65%; } .e6 { top: 45%; left: 40%; }
.poop-evidence { position: absolute; font-size: 40px; }
.pe1 { top: 18%; left: 22%; } .pe2 { top: 38%; left: 62%; } .pe3 { top: 58%; left: 32%; }
.pe4 { top: 28%; left: 82%; } .pe5 { top: 68%; left: 72%; } .pe6 { top: 48%; left: 47%; }
.flashlight { position: absolute; width: 400px; height: 400px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,200,0.15) 0%, transparent 70%); top: 20%; left: 30%; pointer-events: none; }
.headline { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,0.95)); padding: 60px 40px 20px; }
.stat { font-size: 72px; color: #ff1744; font-weight: 900; text-shadow: 0 0 30px rgba(255,23,68,0.5); }
.stat span { color: #ffcc00; font-size: 36px; display: block; margin-top: -5px; }
.subline { font-size: 28px; color: #aaa; margin-top: 10px; font-family: 'Courier New', monospace; }
.subline em { color: #ff1744; font-style: normal; }
.bottom-section { background: #111; padding: 25px 40px; }
.evidence-text { color: #ffcc00; font-size: 32px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; text-align: center; margin-bottom: 15px; }
.cta-row { display: flex; justify-content: space-between; align-items: center; }
.cta-btn { background: #ff1744; color: #fff; padding: 14px 30px; font-size: 22px; font-weight: 900; text-transform: uppercase; border: none; letter-spacing: 2px; }
.contact { color: #fff; text-align: right; }
.contact .phone { font-size: 26px; font-weight: 900; color: #ffcc00; }
.contact .web { font-size: 18px; color: #aaa; margin-top: 4px; }
.brand-tag { color: #ffcc00; font-size: 16px; position: absolute; top: 65px; right: 20px; font-weight: 900; }
.tape-bottom { background: repeating-linear-gradient(90deg, #ffcc00 0px, #ffcc00 30px, #111 30px, #111 60px); height: 30px; }
</style>
</head>
<body>
<div class="container">
  <div class="tape-top"><span>⚠️ CRIME SCENE — DO NOT ENTER ⚠️</span></div>
  <div class="scene">
    <div class="grid-overlay"></div>
    <div class="flashlight"></div>
    <div class="evidence-marker e1">1</div><span class="poop-evidence pe1">💩</span>
    <div class="evidence-marker e2">2</div><span class="poop-evidence pe2">💩</span>
    <div class="evidence-marker e3">3</div><span class="poop-evidence pe3">💩</span>
    <div class="evidence-marker e4">4</div><span class="poop-evidence pe4">💩</span>
    <div class="evidence-marker e5">5</div><span class="poop-evidence pe5">💩</span>
    <div class="evidence-marker e6">6</div><span class="poop-evidence pe6">💩</span>
    <span class="brand-tag">TIDY TAILS 🐕💩</span>
    <div class="headline">
      <div class="stat">274 LBS<span>OF DOG WASTE PER YEAR (per dog)</span></div>
      <div class="subline">You're <em>standing</em> in the evidence.</div>
    </div>
  </div>
  <div class="bottom-section">
    <div class="evidence-text">🔍 Case closed. Call the cleanup crew.</div>
    <div class="cta-row">
      <div class="cta-btn">📞 STARTING AT $25/WEEK</div>
      <div class="contact">
        <div class="phone">314-850-7140</div>
        <div class="web">tidytailsstl.com</div>
      </div>
    </div>
  </div>
  <div class="tape-bottom"></div>
</div>
</body>
</html>
