<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Poop Timeline - Tidy Tails Ad</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1080px; overflow: hidden; font-family: 'Arial Black', 'Helvetica Neue', Arial, sans-serif; }
.container { width: 1080px; height: 1080px; display: flex; flex-direction: column; position: relative; }
.header { background: #1a1a1a; color: #fff; text-align: center; padding: 30px 20px 20px; z-index: 2; }
.header h1 { font-size: 42px; text-transform: uppercase; letter-spacing: 3px; }
.header .sub { font-size: 22px; color: #ffcc00; margin-top: 8px; font-weight: 400; font-family: Arial, sans-serif; }
.split { display: flex; flex: 1; }
.side { width: 50%; position: relative; display: flex; flex-direction: column; }
.side-left { background: linear-gradient(180deg, #5a3a1a 0%, #3d2510 100%); }
.side-right { background: linear-gradient(180deg, #2d6b1e 0%, #1a4a10 100%); }
.day-label { font-size: 18px; color: rgba(255,255,255,0.6); text-align: center; padding: 8px; font-family: Arial, sans-serif; }
.yard { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 10px; position: relative; }
.grass-left { width: 100%; height: 100%; background: repeating-linear-gradient(90deg, #6b8a3a 0px, #5a7a2a 20px, #7a9a4a 40px); position: relative; border-radius: 4px; }
.poop { font-size: 28px; position: absolute; }
.p1 { top: 15%; left: 20%; } .p2 { top: 35%; left: 60%; } .p3 { top: 55%; left: 30%; }
.p4 { top: 25%; left: 45%; } .p5 { top: 65%; left: 70%; } .p6 { top: 45%; left: 15%; }
.p7 { top: 75%; left: 50%; } .p8 { top: 10%; left: 75%; } .p9 { top: 50%; left: 80%; }
.p10 { top: 80%; left: 25%; } .p11 { top: 20%; left: 85%; } .p12 { top: 60%; left: 10%; }
.p13 { top: 40%; left: 50%; } .p14 { top: 70%; left: 40%; }
.flies { font-size: 14px; position: absolute; animation: buzz 0.5s infinite alternate; }
@keyframes buzz { from { transform: translate(-2px, -2px); } to { transform: translate(2px, 2px); } }
.f1 { top: 30%; left: 40%; } .f2 { top: 50%; left: 65%; } .f3 { top: 70%; left: 35%; }
.stink { position: absolute; font-size: 24px; opacity: 0.7; }
.s1 { top: 20%; left: 50%; } .s2 { top: 60%; left: 25%; }
.grass-right { width: 100%; height: 100%; background: repeating-linear-gradient(90deg, #4CAF50 0px, #43A047 20px, #66BB6A 40px); position: relative; border-radius: 4px; }
.sparkle { position: absolute; font-size: 22px; animation: twinkle 1s infinite alternate; }
@keyframes twinkle { from { opacity: 0.4; transform: scale(0.8); } to { opacity: 1; transform: scale(1.2); } }
.sp1 { top: 20%; left: 30%; } .sp2 { top: 50%; left: 60%; } .sp3 { top: 70%; left: 40%; }
.sp4 { top: 35%; left: 75%; } .sp5 { top: 80%; left: 20%; }
.dog-happy { position: absolute; bottom: 10%; right: 15%; font-size: 50px; }
.divider { position: absolute; left: 50%; top: 0; bottom: 0; width: 6px; background: #ffcc00; z-index: 5; }
.vs-badge { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #ffcc00; color: #1a1a1a; font-size: 24px; font-weight: 900; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 6; border: 4px solid #1a1a1a; }
.side-label { position: absolute; bottom: 0; width: 100%; text-align: center; padding: 12px; font-size: 20px; font-weight: 900; text-transform: uppercase; }
.side-left .side-label { background: rgba(200,0,0,0.85); color: #fff; }
.side-right .side-label { background: rgba(0,150,0,0.85); color: #fff; }
.question { background: #ffcc00; color: #1a1a1a; text-align: center; padding: 20px; font-size: 48px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; }
.footer { background: #1a1a1a; color: #fff; display: flex; justify-content: space-between; align-items: center; padding: 16px 30px; }
.footer .brand { font-size: 22px; font-weight: 900; }
.footer .brand span { color: #ffcc00; }
.footer .contact { text-align: right; font-size: 16px; font-family: Arial, sans-serif; }
.footer .contact .phone { color: #ffcc00; font-size: 20px; font-weight: 700; }
.cta { background: #e53935; color: #fff; text-align: center; padding: 14px; font-size: 24px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🐕💩 The Poop Timeline</h1>
    <div class="sub">What 7 days really looks like</div>
  </div>
  <div class="split" style="position: relative;">
    <div class="side side-left">
      <div class="day-label">WITHOUT SERVICE</div>
      <div class="yard">
        <div class="grass-left">
          <span class="poop p1">💩</span><span class="poop p2">💩</span><span class="poop p3">💩</span>
          <span class="poop p4">💩</span><span class="poop p5">💩</span><span class="poop p6">💩</span>
          <span class="poop p7">💩</span><span class="poop p8">💩</span><span class="poop p9">💩</span>
          <span class="poop p10">💩</span><span class="poop p11">💩</span><span class="poop p12">💩</span>
          <span class="poop p13">💩</span><span class="poop p14">💩</span>
          <span class="flies f1">🪰</span><span class="flies f2">🪰</span><span class="flies f3">🪰</span>
          <span class="stink s1">🤢</span><span class="stink s2">🤢</span>
        </div>
      </div>
      <div class="side-label">❌ Day 7: Minefield</div>
    </div>
    <div class="side side-right">
      <div class="day-label">WITH TIDY TAILS</div>
      <div class="yard">
        <div class="grass-right">
          <span class="sparkle sp1">✨</span><span class="sparkle sp2">✨</span>
          <span class="sparkle sp3">✨</span><span class="sparkle sp4">✨</span>
          <span class="sparkle sp5">✨</span>
          <span class="dog-happy">🐕</span>
        </div>
      </div>
      <div class="side-label">✅ Day 7: Paradise</div>
    </div>
    <div class="divider"></div>
    <div class="vs-badge">VS</div>
  </div>
  <div class="question">Which yard is yours? 🤔</div>
  <div class="cta">📞 CALL TODAY — START AT $25/WEEK</div>
  <div class="footer">
    <div class="brand">TIDY <span>TAILS</span> 🐕💩</div>
    <div class="contact">
      <div class="phone">314-850-7140</div>
      <div>tidytailsstl.com</div>
    </div>
  </div>
</div>
</body>
</html>
